name: ci
on:
  push:
    branches: [main]
    tags: ["phase-*", "croft-v*"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        bun: ["1.3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: packages/croft
        run: bun run typecheck
      - name: test
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
        run: bun test
