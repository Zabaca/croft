name: ci
on:
  push:
    branches: [main]
    tags: ["phase-*", "croft-v*"]
  pull_request:
  # The daily run is the whole of what a pull request leaves out (DESIGN.md D191). It is on main's ref, so the concurrency group names the
  # event as well: a push to main must not cancel it, nor it a push.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Whether croft itself needs testing. A push or pull request that touches only the website, the infrastructure
  # (zbc), the repository README or docs/ skips the suite and the smokes: croft's tests read none of those, and the
  # site job below runs for every change anyway. Tags, manual runs, the daily run and a first push of a branch test everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      croft: ${{ steps.diff.outputs.croft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          base=""
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then base="$BEFORE"; fi
          if [ "$EVENT" = pull_request ]; then base="$BASE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "croft=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rest=$(git diff --name-only "$base" "$GITHUB_SHA" \
            | grep -vE '^(packages/site/|packages/infra/|vendor/zbc/|docs/|README\.md$|zbc\.config\.ts$|\.zbc-vendor\.json$|\.sops\.yaml$)' || true)
          if [ -n "$rest" ]; then echo "croft=true" >> "$GITHUB_OUTPUT"; else echo "croft=false" >> "$GITHUB_OUTPUT"; fi
          echo "outside the site and infra: ${rest:-nothing}"

  # What gates a pull request (DESIGN.md D191): the whole suite once, on Linux x64 glibc and the Bun floor, split in shards so each runs about as
  # long as the others (DESIGN.md §10 "Test strategy"), with the typecheck in shard 1. The other platforms and Bun versions run a smoke
  # (the `smoke` job below) and run this suite on a push to main and daily (`test-platforms`). There is no macOS job (D190).
  test:
    name: ubuntu-24.04 · bun 1.3.14 · shard ${{ matrix.shard }}/8
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        bun: ["1.3.14"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      # The mode tests load DuckDB's real extension files (DESIGN.md D117). They are never committed (over 100 MB per
      # platform); this step fetches each from DuckDB's official extension repository over HTTPS and checks it against
      # the checksum croft pins, and the tests fail in CI (CROFT_CI) rather than skip when a file is missing.
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      # The lake profile's tests start Postgres in the foreground, as a child of the test. Never as a service.
      - name: Postgres for the lake tests
        working-directory: packages/croft
        run: |
          if ! bun scripts/check-mode-tools.ts; then
            # A Linux image without Postgres (the arm image may lack it). Debian starts a service on install; a
            # policy-rc.d that refuses (exit 101) keeps it from ever starting, so only the test's own foreground
            # Postgres runs.
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
            sudo chmod +x /usr/sbin/policy-rc.d
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            sudo rm -f /usr/sbin/policy-rc.d
            bun scripts/check-mode-tools.ts
          fi
      # The typecheck is the same in every shard, so one shard runs it.
      - name: typecheck
        if: matrix.shard == 1
        working-directory: packages/croft
        run: bun run typecheck
      - name: test
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        # --timeout: the default timeout tests/preload.ts sets reaches the first test file of a run only (DESIGN.md §10 "Test strategy").
        # --shard: Bun's own split of the test files, the same eight parts in every job (tests/workflows.test.ts, tests/shards.test.ts).
        run: bun test --timeout 60000 --shard=${{ matrix.shard }}/8

  # The suite on the platforms and Bun versions `test` leaves out (DESIGN.md §10 item 8): Linux x64 on the newest Bun, and Linux arm64 on both.
  # Not on a pull request: there each of them runs the smoke instead, and nobody waits for these. In four shards each, on a push to main and daily.
  test-platforms:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }} · shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.croft == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        bun: ["1.3.14", "latest"]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ubuntu-24.04
            bun: "1.3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      # The extension files and Postgres as in `test`, on this platform: the pins differ per platform (linux_amd64, linux_arm64).
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      # The lake profile's tests start Postgres in the foreground, as a child of the test. Never as a service.
      - name: Postgres for the lake tests
        working-directory: packages/croft
        run: |
          if ! bun scripts/check-mode-tools.ts; then
            # A Linux image without Postgres (the arm image may lack it). Debian starts a service on install; a
            # policy-rc.d that refuses (exit 101) keeps it from ever starting, so only the test's own foreground
            # Postgres runs.
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
            sudo chmod +x /usr/sbin/policy-rc.d
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            sudo rm -f /usr/sbin/policy-rc.d
            bun scripts/check-mode-tools.ts
          fi
      - name: test
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun test --timeout 60000 --shard=${{ matrix.shard }}/4

  # Smoke: what every platform and Bun must do on a pull request, in a minute or two (scripts/smoke.ts, DESIGN.md D191): a fresh project
  # runs a pipeline and answers a query, croft serve starts in server mode, answers a key and stops, and the DuckDB extension files pinned for
  # the platform load. The platforms `test` does not cover; always, since it is cheap. There is no macOS job (D190).
  smoke:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }} · smoke
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bun: latest
          - os: ubuntu-24.04-arm
            bun: "1.3.14"
          - os: ubuntu-24.04-arm
            bun: latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      - name: smoke
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/smoke.ts

  # The suite with croft's bookkeeping kept as a lake keeps it, an append-only log on a plain DuckDB file (DESIGN.md D132): no Postgres for
  # the lake, no lake. A job of its own, beside the others, so neither run lengthens the other. One platform is enough, since the log is
  # the same everywhere. On a pull request only the test files that touch the bookkeeping run (scripts/bookkeeping-tests.ts: chosen by what
  # the files say, never by a list; the journeys already run on a log in the lake jobs); on a push to main and daily, all of them.
  # CROFT_BOOKKEEPING is set here and nowhere else; tests/preload.ts adds the mark that lets it take effect (db/bookkeeping.ts).
  test-log:
    name: ubuntu-24.04 · bun 1.3.14 · bookkeeping as a log · shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      # The extension files and Postgres as in `test`; the lake profile's tests need them.
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      # The lake profile's tests start Postgres in the foreground, as a child of the test. Never as a service.
      - name: Postgres for the lake tests
        working-directory: packages/croft
        run: |
          if ! bun scripts/check-mode-tools.ts; then
            # A Linux image without Postgres (the arm image may lack it). Debian starts a service on install; a
            # policy-rc.d that refuses (exit 101) keeps it from ever starting, so only the test's own foreground
            # Postgres runs.
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
            sudo chmod +x /usr/sbin/policy-rc.d
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            sudo rm -f /usr/sbin/policy-rc.d
            bun scripts/check-mode-tools.ts
          fi
      - name: test, bookkeeping as a log, the files that touch it
        if: github.event_name == 'pull_request'
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_BOOKKEEPING: log
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        # The list is made first, so that a script that fails stops the step: inside the test command it would leave no filter, and the
        # whole suite would run.
        run: |
          files=$(bun scripts/bookkeeping-tests.ts)
          bun test --timeout 60000 --shard=${{ matrix.shard }}/4 $files
      - name: test, bookkeeping as a log
        if: github.event_name != 'pull_request'
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_BOOKKEEPING: log
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun test --timeout 60000 --shard=${{ matrix.shard }}/4

  # The end-to-end journeys again with every project's warehouse in a lake (DESIGN.md D146): a SQLite catalog and a local folder in one job,
  # a Postgres catalog and an S3-compatible store (children of the test, never services) in the other. Each is a job of its own with its own
  # timeout, beside the others, so no run lengthens another, and each in shards (DESIGN.md §10 "Test strategy", D191): three for the local lake and
  # five for the Postgres one, so that each runs about 8 to 10 minutes. They run on every pull request; the Postgres one took 29 minutes whole.
  # A journey that is about the warehouse file or about server mode says so (fileOnly in tests/e2e/harness.ts) and does not run on a lake.
  # One platform is enough: what differs from the other jobs is the lake.
  test-lake-local:
    name: ubuntu-24.04 · bun 1.3.14 · journeys on a local lake · shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      # The same extension files and Postgres as the other jobs (see `test` above); the lake journeys fail in CI (CROFT_CI) rather than skip
      # when either is missing.
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      - name: Postgres for the lake tests
        working-directory: packages/croft
        run: |
          if ! bun scripts/check-mode-tools.ts; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install postgresql@17
              bun scripts/check-mode-tools.ts
            else
              # A Linux image without Postgres. Debian starts a service on install; a policy-rc.d that refuses (exit 101) keeps it from
              # ever starting, so only the test's own foreground Postgres runs.
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql
              sudo rm -f /usr/sbin/policy-rc.d
              bun scripts/check-mode-tools.ts
            fi
          fi
      - name: journeys, every warehouse in a SQLite lake
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_E2E_LAKE: local
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun test --timeout 60000 --shard=${{ matrix.shard }}/3 tests/e2e

  test-lake-postgres:
    name: ubuntu-24.04 · bun 1.3.14 · journeys on a Postgres lake · shard ${{ matrix.shard }}/5
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      # The same extension files and Postgres as the other jobs (see `test` above); the lake journeys fail in CI (CROFT_CI) rather than skip
      # when either is missing.
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      - name: Postgres for the lake tests
        working-directory: packages/croft
        run: |
          if ! bun scripts/check-mode-tools.ts; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install postgresql@17
              bun scripts/check-mode-tools.ts
            else
              # A Linux image without Postgres. Debian starts a service on install; a policy-rc.d that refuses (exit 101) keeps it from
              # ever starting, so only the test's own foreground Postgres runs.
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql
              sudo rm -f /usr/sbin/policy-rc.d
              bun scripts/check-mode-tools.ts
            fi
          fi
      - name: journeys, every warehouse in a Postgres catalog and a bucket
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_E2E_LAKE: postgres
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun test --timeout 60000 --shard=${{ matrix.shard }}/5 tests/e2e
      # The store over HTTPS with a self-signed certificate (D160): with the CA the project names every command works; without it, or with another's,
      # every command says LAKE_STORE_TLS. The journeys above reach the store over plain HTTP, which is why they never met the lockdown refusing a CA file.
      # Certificates are made with the runner's openssl program.
      - name: the lake's store over HTTPS
        if: matrix.shard == 1
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun test --timeout 60000 src/db/store-tls.test.ts
      # A lake croft wrote is read by DuckDB 1.5 as well (the lake is format 1.0, D137, acceptance 11): an older DuckDB and its extension files
      # are fetched into a folder of the runner and the recipe of `croft docs lake` is run with them.
      - name: a lake read by DuckDB 1.5.5
        if: matrix.shard == 1
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: |
          bun scripts/fetch-old-duckdb.ts "$RUNNER_TEMP/old-duckdb"
          CROFT_TEST_OLD_DUCKDB="$RUNNER_TEMP/old-duckdb/node" CROFT_TEST_OLD_EXTENSIONS="$RUNNER_TEMP/old-duckdb/ext" bun test --timeout 60000 src/db/lake-reader-recipe.test.ts src/db/old-extension-pins.test.ts

  # Smoke: Alpine (musl) installs and prints its version, and a fresh project runs its example and answers a query.
  alpine:
    name: alpine smoke
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: oven/bun:1.3.14-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - name: version, init, run, query
        run: |
          set -e
          bun packages/croft/bin/croft.mjs --version
          dir=$(mktemp -d)/proj
          bun packages/croft/bin/croft.mjs init "$dir" --no-install
          mkdir -p "$dir/node_modules/@zabaca" && ln -s "$PWD/packages/croft" "$dir/node_modules/@zabaca/croft"
          cd "$dir"
          bun "$GITHUB_WORKSPACE/packages/croft/bin/croft.mjs" run example_sales --foreground
          bun "$GITHUB_WORKSPACE/packages/croft/bin/croft.mjs" query "select count(*) as n from example_sales"

  # Smoke: native Windows is unsupported in v1 (DESIGN.md §2); croft must say so clearly, not crash.
  windows:
    name: windows smoke
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: version and doctor
        shell: bash
        run: |
          bun packages/croft/bin/croft.mjs --version
          bun packages/croft/bin/croft.mjs doctor --json > doctor.json || true
          cat doctor.json

  # The website (packages/site): its pages are generated from croft's own docs, and its tests hold the plugin's skill
  # and the hand-written pages to the commands croft has. A failed build here is a docs page croft can no longer back.
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - name: build
        working-directory: packages/site
        run: bun run build
      - name: test
        working-directory: packages/site
        run: bun test
