name: ci
on:
  push:
    branches: [main]
    tags: ["phase-*", "croft-v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Whether croft itself needs testing. A push or pull request that touches only the website, the infrastructure
  # (zbc), the repository README or docs/ skips the suite and the smokes: croft's tests read none of those, and the
  # site job below runs for every change anyway. Tags, manual runs and a first push of a branch test everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      croft: ${{ steps.diff.outputs.croft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          base=""
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then base="$BEFORE"; fi
          if [ "$EVENT" = pull_request ]; then base="$BASE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "croft=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rest=$(git diff --name-only "$base" "$GITHUB_SHA" \
            | grep -vE '^(packages/site/|packages/infra/|vendor/zbc/|docs/|README\.md$|zbc\.config\.ts$|\.zbc-vendor\.json$|\.sops\.yaml$)' || true)
          if [ -n "$rest" ]; then echo "croft=true" >> "$GITHUB_OUTPUT"; else echo "croft=false" >> "$GITHUB_OUTPUT"; fi
          echo "outside the site and infra: ${rest:-nothing}"

  # Tier 1 (DESIGN.md §10 item 8): macOS arm64, Linux x64 glibc and Linux arm64, on the Bun floor and latest.
  test:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        bun: ["1.3.14", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: git identity
        run: git config --global user.email ci@zabaca.com && git config --global user.name "croft ci"
      - run: bun install --frozen-lockfile
      # The mode tests load DuckDB's real extension files (DESIGN.md D117). They are never committed (over 100 MB per
      # platform); this step fetches each from DuckDB's official extension repository over HTTPS and checks it against
      # the checksum croft pins, and the tests fail in CI (CROFT_CI) rather than skip when a file is missing.
      - name: DuckDB extension files, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/croft-extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/croft/src/db/extension-pins.ts') }}
      - name: fetch and verify the DuckDB extension files
        working-directory: packages/croft
        env:
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun scripts/fetch-extensions.ts
      # The lake profile's tests start Postgres in the foreground, as a child of the test. Never as a service.
      - name: Postgres for the lake tests
        working-directory: packages/croft
        run: |
          if ! bun scripts/check-mode-tools.ts; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install postgresql@17
              bun scripts/check-mode-tools.ts
            else
              # A Linux image without Postgres (the arm image may lack it). Debian starts a service on install; a
              # policy-rc.d that refuses (exit 101) keeps it from ever starting, so only the test's own foreground
              # Postgres runs.
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql
              sudo rm -f /usr/sbin/policy-rc.d
              bun scripts/check-mode-tools.ts
            fi
          fi
      - name: typecheck
        working-directory: packages/croft
        run: bun run typecheck
      - name: test
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        # --timeout: the default timeout tests/preload.ts sets reaches the first test file of a run only (DESIGN.md §10 "Test strategy").
        run: bun test --timeout 60000
      # The whole suite again with croft's bookkeeping kept as a lake keeps it, an append-only log on a plain DuckDB file
      # (DESIGN.md D-L1): no Postgres, no lake. One job is enough, since the log is the same on every platform.
      - name: test, bookkeeping as a log
        if: matrix.os == 'ubuntu-24.04' && matrix.bun == '1.3.14'
        working-directory: packages/croft
        env:
          CROFT_CI: "1"
          CROFT_BOOKKEEPING: log
          CROFT_EXTENSION_DIR: ${{ runner.temp }}/croft-extensions
        run: bun test --timeout 60000

  # Smoke: Alpine (musl) installs and prints its version, and a fresh project runs its example and answers a query.
  alpine:
    name: alpine smoke
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: oven/bun:1.3.14-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - name: version, init, run, query
        run: |
          set -e
          bun packages/croft/bin/croft.mjs --version
          dir=$(mktemp -d)/proj
          bun packages/croft/bin/croft.mjs init "$dir" --no-install
          mkdir -p "$dir/node_modules/@zabaca" && ln -s "$PWD/packages/croft" "$dir/node_modules/@zabaca/croft"
          cd "$dir"
          bun "$GITHUB_WORKSPACE/packages/croft/bin/croft.mjs" run example_sales --foreground
          bun "$GITHUB_WORKSPACE/packages/croft/bin/croft.mjs" query "select count(*) as n from example_sales"

  # Smoke: native Windows is unsupported in v1 (DESIGN.md §2); croft must say so clearly, not crash.
  windows:
    name: windows smoke
    needs: changes
    if: needs.changes.outputs.croft == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: version and doctor
        shell: bash
        run: |
          bun packages/croft/bin/croft.mjs --version
          bun packages/croft/bin/croft.mjs doctor --json > doctor.json || true
          cat doctor.json

  # The website (packages/site): its pages are generated from croft's own docs, and its tests hold the plugin's skill
  # and the hand-written pages to the commands croft has. A failed build here is a docs page croft can no longer back.
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - name: build
        working-directory: packages/site
        run: bun run build
      - name: test
        working-directory: packages/site
        run: bun test
