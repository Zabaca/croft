# age public keys that may decrypt this project's secrets. Private keys stay on
# each holder's machine (macOS: ~/Library/Application Support/sops/age/keys.txt,
# Linux: ~/.config/sops/age/keys.txt); only the public half belongs here.
#
# Recipients, in order. Attribution is written down because an age public key
# carries no identity of its own:
#
#   age1dhsl...  maintainer laptop. Verified 2026-09-22: it is the public half of
#                the only identity in that laptop's sops keys.txt.
#   age1cq0k...  maintainer workstation. Confirmed by the maintainer on
#                2026-09-22. Another repository's recipients file attributes it
#                to a different holder; that note conflicts with this one and
#                should be corrected.
#   age1llqq...  build server, first identity. That server's keys.txt holds two
#   age1ar5d...  identities; the second is the build server's too. Both are
#                labeled as the maintainer's in another repository's recipients
#                file. Not verified from the laptop.
#
# CI has no key yet. When it gets one, store the private key as the GitHub
# Actions secret SOPS_AGE_KEY and add its public key below.
#
# Adding a key does not re-encrypt existing files. After editing, run:
#   sops updatekeys packages/infra/environments/<env>/secrets.yaml
creation_rules:
  - age: >-
      age1dhslnakk54dn5vd7q7hjuemrchwxtka0ux8nkvm4psp9u3g9hsxsjzvsdz,
